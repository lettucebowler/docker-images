services:
  papermc:
    image: ghcr.io/itzg/minecraft-server:java25
    container_name: papermc
    environment:
      EULA: TRUE
      TYPE: PAPER
      VERSION: 26.3
      OPS: lettucebowler
      WHITELIST: |
        lettucebowler
        gabby_stabby
        _kronk13_
        ewald88
        dylanlee1998
        MrsMelatonin
      EXISTING_WHITELIST_FILE: MERGE
      ENFORCE_WHITELIST: TRUE
      DIFFICULTY: normal
      ALLOW_NETHER: TRUE
      SERVER_NAME: LettuceCraft
      MOTD: Pokey stick
      ONLINE_MODE: TRUE
      OVERRIDE_SERVER_PROPERTIES: TRUE
      MAX_TICK_TIME: -1
      USE_AIKAR_FLAGS: FALSE
      TZ: America/Chicago
      INIT_MEMORY: 4G
      MAX_MEMORY: 16G
      ENABLE_ROLLING_LOGS: TRUE
      VIEW_DISTANCE: 12
      PLUGINS: |
        https://ci.ender.zone/job/EssentialsX/lastSuccessfulBuild/artifact/jars/EssentialsX-2.22.1-dev+27-e70bdb8.jar
        https://cdn.modrinth.com/data/fALzjamp/versions/MdY6JATr/Chunky-Bukkit-1.5.3.jar
        https://cdn.modrinth.com/data/PFb7ZqK6/versions/Daa888xO/squaremap-paper-mc26.3-1.4.2.jar
        https://cdn.modrinth.com/data/1u6JkXh5/versions/YFnqiUlL/worldedit-bukkit-7.4.6.jar
        https://cdn.modrinth.com/data/OhduvhIc/versions/O12m3jOR/veinminer-paper-2.12.3.jar
        https://cdn.modrinth.com/data/YrkmSvXh/versions/Y03wbmYU/TreeFeller-1.32.1.jar
        https://cdn.modrinth.com/data/Vebnzrzj/versions/b0mk8uS6/LuckPerms-Bukkit-5.5.71.jar
        https://cdn.modrinth.com/data/P1OZGk5p/versions/5WgnasGG/ViaVersion-5.12.1.jar
        https://cdn.modrinth.com/data/84zcagOb/versions/korVu0dL/voxy-server-side-paper.jar
        https://cdn.modrinth.com/data/RfE1BSdK/versions/JwSofX5c/OnePlayerSleep-4.1.0.jar
      JVM_OPTS: "-XX:+UnlockExperimentalVMOptions -XX:+UnlockDiagnosticVMOptions -XX:+AlwaysActAsServerClassMachine -XX:+AlwaysPreTouch -XX:+DisableExplicitGC -XX:+UseNUMA -XX:NmethodSweepActivity=1 -XX:ReservedCodeCacheSize=400M -XX:NonNMethodCodeHeapSize=12M -XX:ProfiledCodeHeapSize=194M -XX:NonProfiledCodeHeapSize=194M -XX:-DontCompileHugeMethods -XX:MaxNodeLimit=240000 -XX:NodeLimitFudgeFactor=8000 -XX:+UseVectorCmov -XX:+PerfDisableSharedMem -XX:+UseFastUnorderedTimeStamps -XX:+UseCriticalJavaThreadPriority -XX:ThreadPriorityPolicy=1 -XX:+UseZGC -XX:AllocatePrefetchStyle=1 -XX:-ZProactive"
    volumes:
      - /opt/docker/volumes/minecraft/papermc-data:/data
      - ./plugins:/plugins
    restart: always
    ports:
      - 25565:25565

  tunnel:
    container_name: minecraft-tunnel
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
